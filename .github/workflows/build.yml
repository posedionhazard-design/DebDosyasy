name: Build DEB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip'i ac
        run: |
          mkdir -p src
          ditto -x -k Dolphin.zip src || unzip -q -o Dolphin.zip -d src
          rm -rf src/__MACOSX
          find src -maxdepth 3 -not -path '*/.git/*' | head -60
          echo "---- iTOP / slua / unreal iceren dosyalar ----"
          find src \( -iname '*itop*' -o -iname '*slua*' -o -iname '*unreal*' \) | head -80
          echo "---- SDK klasorundeki .cpp dosyalari (ilk 80) ----"
          find src -path '*SDK*' -name '*.cpp' | head -80
          echo "SDK dosya sayisi:"
          find src -type f -path '*SDK*' | wc -l

      - name: Araclari kur
        run: |
          brew install ldid dpkg || true

      - name: Xcode projesini bul
        run: |
          XP=$(find src -maxdepth 5 -name '*.xcodeproj' | head -1)
          if [ -z "$XP" ]; then echo "HATA: .xcodeproj bulunamadi"; exit 1; fi
          echo "Proje: $XP"
          echo "XCODEPROJ=$XP" >> $GITHUB_ENV
          xcodebuild -list -project "$XP" || true
          SCHEME=$(xcodebuild -list -json -project "$XP" | python3 -c "import sys,json; d=json.load(sys.stdin)['project']; print((d.get('schemes') or d.get('targets'))[0])")
          echo "Scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Eksik dosya taramasi (xcodeproj ile zip karsilastir)
        run: |
          python3 - << 'PY' 2>&1 | tee tarama.log
          import json, os, subprocess, unicodedata, difflib, shutil

          def nfc(s):
              return unicodedata.normalize("NFC", s)

          try:
              xp = os.environ["XCODEPROJ"]
              proj_dir = os.path.dirname(os.path.abspath(xp))
              pb = os.path.join(xp, "project.pbxproj")
              data = json.loads(subprocess.check_output(["plutil", "-convert", "json", "-o", "-", pb]))
              objs = data["objects"]

              parent = {}
              for oid, o in objs.items():
                  if o.get("isa") in ("PBXGroup", "PBXVariantGroup", "PBXReferenceProxy"):
                      for c in o.get("children", []):
                          parent[c] = oid

              def resolve(oid):
                  parts = []
                  cur = oid
                  while cur:
                      o = objs[cur]
                      p = o.get("path")
                      st = o.get("sourceTree", "<group>")
                      if p:
                          parts.insert(0, p)
                      if st == "<absolute>":
                          return os.path.join(*parts) if parts else None
                      if st == "SOURCE_ROOT":
                          return os.path.join(proj_dir, *parts)
                      if st == "<group>":
                          cur = parent.get(cur)
                          continue
                      return None
                  return os.path.join(proj_dir, *parts) if parts else None

              # src icindeki tum dosyalar
              index = []
              for root, dirs, files in os.walk("src"):
                  for f in files:
                      index.append((nfc(f), os.path.join(root, f)))

              refs = [(oid, o) for oid, o in objs.items() if o.get("isa") == "PBXFileReference"]
              total = missing = fixed = placeholders = 0
              print("Projede kayitli dosya sayisi:", len(refs))
              print("=" * 60)
              for oid, o in refs:
                  path = resolve(oid)
                  if not path:
                      continue
                  total += 1
                  if os.path.exists(path):
                      continue
                  missing += 1
                  name = nfc(os.path.basename(path))
                  print("EKSIK:", path)

                  strong = []
                  lname = name.lower()
                  for n, full in index:
                      if n.lower() == lname:
                          strong.append(full)
                  if not strong and "_" in name:
                      suf = name.split("_", 1)[1].lower()
                      tier1 = [full for n, full in index if "_" in n and n.split("_", 1)[1].lower() == suf]
                      tier2 = [full for n, full in index if n.lower().endswith(suf)]
                      strong = tier1 or tier2

                  fuzzy = []
                  ext = os.path.splitext(name)[1].lower()
                  pool = [n for n, _ in index if os.path.splitext(n)[1].lower() == ext]
                  for m in difflib.get_close_matches(name, pool, n=3, cutoff=0.6):
                      for n, full in index:
                          if n == m and full not in strong and full not in fuzzy:
                              fuzzy.append(full)

                  cands = strong + fuzzy
                  for c in cands[:5]:
                      print("   aday:", c)
                  if not cands:
                      print("   aday yok: dosya zip icinde bulunamadi")

                  pick = None
                  if len(strong) > 1:
                      exp_dir = os.path.basename(os.path.dirname(path)).lower()
                      same_dir = [c for c in strong if os.path.basename(os.path.dirname(c)).lower() == exp_dir]
                      if len(same_dir) >= 1:
                          strong = same_dir
                  if len(strong) > 1:
                      import hashlib
                      hs = set(hashlib.md5(open(c, "rb").read()).hexdigest() for c in strong)
                      if len(hs) == 1:
                          strong = strong[:1]
                  if len(strong) == 1:
                      pick = strong[0]
                  elif not strong and len(fuzzy) == 1:
                      r = difflib.SequenceMatcher(None, name, nfc(os.path.basename(fuzzy[0]))).ratio()
                      if r >= 0.85:
                          pick = fuzzy[0]
                  elif len(strong) > 1:
                      print("   BELIRSIZ: birden fazla aday var, otomatik secilmedi")
                  if pick:
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      shutil.copy2(pick, path)
                      fixed += 1
                      print("   -> OTOMATIK DUZELTILDI: kopyalandi:", pick)
                  elif "/SDK/" in path.replace(os.sep, "/") and os.path.splitext(path)[1].lower() in (".cpp", ".cc", ".c", ".mm"):
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, "w") as fh:
                          fh.write("// BOS YER TUTUCU: bu dosya zip icinde bulunamadi, derlemenin devam etmesi icin olusturuldu\n")
                      placeholders += 1
                      print("   -> UYARI: zip'te yok, BOS yer tutucu olusturuldu (bu dosyanin fonksiyonlari eksik olacak)")

              print("=" * 60)
              print("Kontrol edilen: %d | Eksik: %d | Otomatik duzeltilen: %d | Bos yer tutucu: %d | Hala eksik: %d"
                    % (total, missing, fixed, placeholders, missing - fixed - placeholders))
          except Exception as e:
              print("Tarama hatasi (devam ediliyor):", repr(e))
          PY
          {
            echo "## Eksik dosya taramasi"
            echo '```'
            grep -E "EKSIK|aday|UYARI|BELIRSIZ|OTOMATIK|Kontrol edilen" tarama.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Eksik imgui Metal dosyalarini tamamla
        run: |
          IMGUI_H=$(find src -name imgui.h | head -1)
          if [ -z "$IMGUI_H" ]; then echo "imgui.h bulunamadi, atlaniyor"; exit 0; fi
          IMGUI_DIR=$(dirname "$IMGUI_H")
          VER=$(grep -m1 '#define IMGUI_VERSION ' "$IMGUI_H" | sed -E 's/.*"([^"]+)".*/\1/')
          VER=${VER%% *}
          echo "imgui klasoru: $IMGUI_DIR"
          echo "imgui surumu: $VER"
          for F in imgui_impl_metal.mm imgui_impl_metal.h; do
            if [ ! -f "$IMGUI_DIR/$F" ]; then
              echo "$F eksik, indiriliyor (v$VER)"
              curl -fsSL "https://raw.githubusercontent.com/ocornut/imgui/v$VER/backends/$F" -o "$IMGUI_DIR/$F" \
              || curl -fsSL "https://raw.githubusercontent.com/ocornut/imgui/v$VER/examples/$F" -o "$IMGUI_DIR/$F" \
              || curl -fsSL "https://raw.githubusercontent.com/ocornut/imgui/master/backends/$F" -o "$IMGUI_DIR/$F"
            fi
          done
          ls -la "$IMGUI_DIR" | head -40

      - name: Xcode ile derle (hata olursa otomatik duzelt ve tekrar dene)
        run: |
          python3 - << 'PY'
          import os, re, subprocess, shutil, hashlib, unicodedata

          WS = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          XCODEPROJ = os.environ.get("XCODEPROJ", "")
          SCHEME = os.environ.get("SCHEME", "")
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          HDR_DIR = os.path.join(WS, "auto_headers")
          MAX_TRIES = 10
          SRC_EXT = (".cpp", ".cc", ".c", ".mm", ".m")
          HDR_EXT = (".h", ".hpp", ".hh", ".inl", ".pch")

          def nfc(s):
              return unicodedata.normalize("NFC", s)

          def build_index():
              idx = []
              for root, dirs, files in os.walk(os.path.join(WS, "src")):
                  for f in files:
                      idx.append((nfc(f), os.path.join(root, f)))
              return idx

          def find_candidate(name, index):
              lname = name.lower()
              strong = [full for n, full in index if n.lower() == lname]
              if not strong and "_" in name:
                  suf = name.split("_", 1)[1].lower()
                  strong = [full for n, full in index if "_" in n and n.split("_", 1)[1].lower() == suf]
                  if not strong:
                      strong = [full for n, full in index if n.lower().endswith(suf)]
              if len(strong) > 1:
                  hs = set(hashlib.md5(open(c, "rb").read()).hexdigest() for c in strong)
                  if len(hs) == 1:
                      strong = strong[:1]
              return strong[0] if len(strong) == 1 else None

          def fix_missing_input(path, index, log):
              name = nfc(os.path.basename(path))
              cand = find_candidate(name, index)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              if cand:
                  shutil.copy2(cand, path)
                  log.append("kopyalandi: %s <- %s" % (name, os.path.relpath(cand, WS)))
              else:
                  ext = os.path.splitext(name)[1].lower()
                  with open(path, "w") as fh:
                      fh.write("// OTOMATIK BOS YER TUTUCU: %s zip icinde bulunamadi\n" % name)
                  log.append("BOS yer tutucu olusturuldu: %s" % name)
              return True

          def fix_missing_header(inc, index, log):
              target = os.path.join(HDR_DIR, inc)
              if os.path.exists(target):
                  return False
              os.makedirs(os.path.dirname(target), exist_ok=True)
              cand = find_candidate(nfc(os.path.basename(inc)), index)
              if cand:
                  shutil.copy2(cand, target)
                  log.append("header kopyalandi: %s <- %s" % (inc, os.path.relpath(cand, WS)))
              else:
                  with open(target, "w") as fh:
                      fh.write("// OTOMATIK BOS HEADER: %s bulunamadi\n#pragma once\n" % inc)
                  log.append("BOS header olusturuldu: %s" % inc)
              return True

          def analyze(text, index, defines):
              log = []
              fixes = 0
              seen = set()
              for m in re.finditer(r"Build input file cannot be found: '(.+?)'", text):
                  p = m.group(1)
                  if p in seen:
                      continue
                  seen.add(p)
                  if not os.path.exists(p):
                      fixes += fix_missing_input(p, index, log)
              for m in re.finditer(r"fatal error: '(.+?)' file not found", text):
                  inc = m.group(1)
                  if inc in seen:
                      continue
                  seen.add(inc)
                  fixes += fix_missing_header(inc, index, log)
              for m in re.finditer(r"unknown type name '(__\w+)'|expected ';' after top level declarator", text):
                  pass
              for m in re.finditer(r"unknown type name '(__(?:cdecl|stdcall|fastcall|thiscall|vectorcall|forceinline))'", text):
                  d = m.group(1)
                  if d not in defines:
                      defines[d] = "inline" if d == "__forceinline" else ""
                      log.append("tanim eklendi: %s=%s" % (d, defines[d]))
                      fixes += 1
              return fixes, log

          # ---- main ----
          def run_build(defines):
              defs = " ".join("%s=%s" % (k, v) for k, v in defines.items())
              cmd = [
                  "xcodebuild", "build", "-project", XCODEPROJ, "-scheme", SCHEME,
                  "-configuration", "Release", "-sdk", "iphoneos",
                  "-destination", "generic/platform=iOS",
                  "-derivedDataPath", os.path.join(WS, "build"),
                  "ARCHS=arm64", "ONLY_ACTIVE_ARCH=NO",
                  "CODE_SIGNING_ALLOWED=NO", "CODE_SIGNING_REQUIRED=NO", "CODE_SIGN_IDENTITY=",
                  "IPHONEOS_DEPLOYMENT_TARGET=14.0",
                  "GCC_PREPROCESSOR_DEFINITIONS=$(inherited) " + defs,
                  "HEADER_SEARCH_PATHS=$(inherited) " + HDR_DIR,
              ]
              r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors="replace")
              open(os.path.join(WS, "build.log"), "w").write(r.stdout)
              return r.returncode, r.stdout

          if __name__ == "__main__":
              os.makedirs(HDR_DIR, exist_ok=True)
              defines = {"__forceinline": "inline"}
              report = []
              rc = 1
              out = ""
              for attempt in range(1, MAX_TRIES + 1):
                  rc, out = run_build(defines)
                  print("== Deneme %d: cikis kodu %d ==" % (attempt, rc), flush=True)
                  if rc == 0:
                      break
                  idx = build_index()
                  fixes, log = analyze(out, idx, defines)
                  for l in log:
                      print("  DUZELTME:", l, flush=True)
                      report.append("Deneme %d: %s" % (attempt, l))
                  if fixes == 0:
                      print("  Otomatik duzeltilebilecek hata kalmadi.", flush=True)
                      break
              errs = sorted(set(re.sub(r"/Users/runner/work/[^/]+/[^/]+/", "", l.strip())
                                for l in out.splitlines() if "error:" in l or "undefined symbol" in l.lower()))
              print("================ HATA OZETI ================")
              for e in errs[:40]:
                  print(e)
              with open(SUMMARY, "a") as fh:
                  fh.write("## Otomatik duzeltmeler\n```\n" + ("\n".join(report) or "yok") + "\n```\n")
                  fh.write("## Kalan hatalar\n```\n" + ("\n".join(errs[:40]) or "yok") + "\n```\n")
              print("---- Son 20 satir ----")
              print("\n".join(out.splitlines()[-20:]))
              raise SystemExit(rc)
          PY

      - name: .deb olustur
        run: |
          mkdir -p out pkg/DEBIAN pkg/Library/MobileSubstrate/DynamicLibraries
          DYLIB=$(find build/Build/Products -name '*.dylib' | head -1)
          if [ -z "$DYLIB" ]; then
            echo "HATA: dylib uretilmedi. Hedef dylib degil, app olabilir. Yukaridaki dosya listesine bak."
            exit 1
          fi
          echo "Dylib: $DYLIB"
          NAME=$(basename "$DYLIB")
          cp "$DYLIB" "pkg/Library/MobileSubstrate/DynamicLibraries/$NAME"
          ldid -S "pkg/Library/MobileSubstrate/DynamicLibraries/$NAME" || true
          # JRMemory.framework varsa yanina ekle
          FW=$(find src -name 'JRMemory.framework' -maxdepth 4 | head -1)
          if [ -n "$FW" ]; then
            mkdir -p pkg/Library/Frameworks
            cp -R "$FW" pkg/Library/Frameworks/
          fi
          cat > pkg/DEBIAN/control << CTRL
          Package: com.dolphin.tweak
          Name: Dolphin
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Dolphin dylib
          Maintainer: Dolphin
          Author: Dolphin
          Section: Tweaks
          CTRL
          sed -i '' 's/^[[:space:]]*//' pkg/DEBIAN/control
          dpkg-deb -Zgzip --root-owner-group -b pkg "out/Dolphin_1.0.0_iphoneos-arm.deb"
          cp "$DYLIB" out/
          ls -la out

      - name: Artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: out/*
          if-no-files-found: error
