name: Build DEB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip'i ac
        run: |
          mkdir -p src
          unzip -q -o Dolphin.zip -d src
          rm -rf src/__MACOSX
          find src -maxdepth 3 -not -path '*/.git/*' | head -60

      - name: Araclari kur
        run: |
          brew install ldid dpkg || true

      - name: Xcode projesini bul
        run: |
          XP=$(find src -maxdepth 5 -name '*.xcodeproj' | head -1)
          if [ -z "$XP" ]; then echo "HATA: .xcodeproj bulunamadi"; exit 1; fi
          echo "Proje: $XP"
          echo "XCODEPROJ=$XP" >> $GITHUB_ENV
          xcodebuild -list -project "$XP" || true
          SCHEME=$(xcodebuild -list -json -project "$XP" | python3 -c "import sys,json; d=json.load(sys.stdin)['project']; print((d.get('schemes') or d.get('targets'))[0])")
          echo "Scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Eksik imgui Metal dosyalarini tamamla
        run: |
          IMGUI_H=$(find src -name imgui.h | head -1)
          if [ -z "$IMGUI_H" ]; then echo "imgui.h bulunamadi, atlaniyor"; exit 0; fi
          IMGUI_DIR=$(dirname "$IMGUI_H")
          VER=$(grep -m1 '#define IMGUI_VERSION ' "$IMGUI_H" | sed -E 's/.*"([^"]+)".*/\1/')
          VER=${VER%% *}
          echo "imgui klasoru: $IMGUI_DIR"
          echo "imgui surumu: $VER"
          for F in imgui_impl_metal.mm imgui_impl_metal.h; do
            if [ ! -f "$IMGUI_DIR/$F" ]; then
              echo "$F eksik, indiriliyor (v$VER)"
              curl -fsSL "https://raw.githubusercontent.com/ocornut/imgui/v$VER/backends/$F" -o "$IMGUI_DIR/$F" \
              || curl -fsSL "https://raw.githubusercontent.com/ocornut/imgui/v$VER/examples/$F" -o "$IMGUI_DIR/$F" \
              || curl -fsSL "https://raw.githubusercontent.com/ocornut/imgui/master/backends/$F" -o "$IMGUI_DIR/$F"
            fi
          done
          ls -la "$IMGUI_DIR" | head -40

      - name: Xcode ile derle
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            | tail -n 200
          echo "---- Uretilen dosyalar ----"
          find build/Build/Products -maxdepth 3 | head -50

      - name: .deb olustur
        run: |
          mkdir -p out pkg/DEBIAN pkg/Library/MobileSubstrate/DynamicLibraries
          DYLIB=$(find build/Build/Products -name '*.dylib' | head -1)
          if [ -z "$DYLIB" ]; then
            echo "HATA: dylib uretilmedi. Hedef dylib degil, app olabilir. Yukaridaki dosya listesine bak."
            exit 1
          fi
          echo "Dylib: $DYLIB"
          NAME=$(basename "$DYLIB")
          cp "$DYLIB" "pkg/Library/MobileSubstrate/DynamicLibraries/$NAME"
          ldid -S "pkg/Library/MobileSubstrate/DynamicLibraries/$NAME" || true
          # JRMemory.framework varsa yanina ekle
          FW=$(find src -name 'JRMemory.framework' -maxdepth 4 | head -1)
          if [ -n "$FW" ]; then
            mkdir -p pkg/Library/Frameworks
            cp -R "$FW" pkg/Library/Frameworks/
          fi
          cat > pkg/DEBIAN/control << CTRL
          Package: com.dolphin.tweak
          Name: Dolphin
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Dolphin dylib
          Maintainer: Dolphin
          Author: Dolphin
          Section: Tweaks
          CTRL
          sed -i '' 's/^[[:space:]]*//' pkg/DEBIAN/control
          dpkg-deb -Zgzip --root-owner-group -b pkg "out/Dolphin_1.0.0_iphoneos-arm.deb"
          cp "$DYLIB" out/
          ls -la out

      - name: Artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: out/*
          if-no-files-found: error
